<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <!-- 引入独立的 CSS 样式文件，保持 HTML 结构与样式分离 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 页面主容器：负责将名片卡片居中显示 -->
    <main class="page-container">
        <!-- 个人名片卡片 -->
        <article class="profile-card">
            <!-- 圆形头像区域，使用姓名首字作为简洁头像 -->
            <div class="avatar" aria-label="林墨的头像" role="img">林</div>

            <!-- 个人基本信息 -->
            <div class="profile-info">
                <h1>刘宇宣</h1>
                <p class="job-title">产品设计师</p>
                <p class="introduction">专注于用清晰、温度与细节，创造有价值的数字体验。</p>
            </div>

            <!-- 联系方式列表 -->
            <address class="contact-list">
                <a href="mailto:linmo@example.com" class="contact-item">
                    <span class="contact-icon" aria-hidden="true">✉</span>
                    <span>linmo@example.com</span>
                </a>
                <a href="tel:+8613800138000" class="contact-item">
                    <span class="contact-icon" aria-hidden="true">☎</span>
                    <span>+86 138 0013 8000</span>
                </a>
                <span class="contact-item">
                    <span class="contact-icon" aria-hidden="true">⌖</span>
                    <span>上海，中国</span>
                </span>
            </address>
        </article>
    </main>
</body>
</html>
